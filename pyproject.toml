[project]
name = "rulereach"
version = "0.1.0"
description = "Check whether your agent instruction files reach the agent at all: Codex, Claude Code, Cursor, Copilot."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Topicspot" }]
keywords = ["agents-md", "claude-code", "cursor", "copilot", "developer-tools", "lint"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/Topicspot/rulereach"
Repository = "https://github.com/Topicspot/rulereach"
Issues = "https://github.com/Topicspot/rulereach/issues"
Changelog = "https://github.com/Topicspot/rulereach/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "ruff==0.16.0",
  "mypy==2.3.0",
  "types-PyYAML",
  "vulture>=2.16",
  "pip-audit>=2.7",
  "pillow>=11",
]

[project.scripts]
rulereach = "rulereach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulereach"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "scripts"]

# Pillow is a dev-only dependency of scripts/demo_gif.py. CI installs the type checker
# without it, so the import must not be a hard error.
[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
